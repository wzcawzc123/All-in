<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="豆包">
  <defs>
    <linearGradient id="db-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C9BFF"/>
      <stop offset="1" stop-color="#1C5FD0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#db-bg)"/>
  <!-- 豆荚：圆润椭圆 -->
  <ellipse cx="32" cy="34" rx="16.5" ry="14" fill="#FFFFFF"/>
  <!-- 左上凹口，形成豆子的标志性缺口 -->
  <circle cx="24.5" cy="22.5" r="6.2" fill="url(#db-bg)"/>
  <!-- 豆子上的两点高光 -->
  <circle cx="27.5" cy="36" r="2.1" fill="url(#db-bg)"/>
  <circle cx="37.5" cy="36" r="2.1" fill="url(#db-bg)"/>
</svg>
